[package]
name = "sizetree"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Display disk usage as a tree, largest entries first"
license = "AGPL-3.0-only"
repository = "https://github.com/adpego/SizeTree"
readme = "README.md"
keywords = ["disk", "usage", "du", "tree", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
glob = "0.3.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
